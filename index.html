<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Word</title>
    <link rel="stylesheet" href="guess.css">
</head>
<body>

    <!-- Game Title -->
    <h1>Guess The Word</h1>

    <!-- Language Selector -->
    <div class="language-select">
        <button id="lang-ar" class="active">عربي</button>
        <button id="lang-en">English</button>
    </div>

    <!-- Main Game Container -->
    <div class="guess-game">
        
        <!-- Game Area -->
        <div class="game-area">
            <div class="inputs"></div>
            <div class="control">
                <button class="check">Check Word</button>
                <button class="hint"><span>2</span> Hints</button>
            </div>
            <div class="message"></div>
        </div>

        <!-- Key Colors Section -->
        <div class="key-colors">
            <h2>Key Colors</h2>
            
            <div class="key-color">
                <div class="key in-place"></div>
                <div class="key-test">Letter Is Correct and In Place</div>
            </div>
            
            <div class="key-color">
                <div class="key not-in-place"></div>
                <div class="key-test">Letter Is Correct But Not In Place</div>
            </div>
            
            <div class="key-color">
                <div class="key no"></div>
                <div class="key-test">Letter Is Wrong</div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer></footer>

    <script src="guess.js"></script>
</body>
</html>
